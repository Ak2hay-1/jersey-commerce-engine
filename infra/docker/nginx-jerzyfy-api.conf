# Jerzyfy API — cohost with Cullinos nginx (host owns :80/:443).
#
# Install on the shared VM:
#   sudo cp infra/docker/nginx-jerzyfy-api.conf /etc/nginx/sites-available/api.jerzyfy.in.conf
#   sudo ln -sf /etc/nginx/sites-available/api.jerzyfy.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.jerzyfy.in
#
# Prerequisites:
#   - DNS A record: api.jerzyfy.in → this VM
#   - Jerzyfy API listening on 127.0.0.1:4000 (docker-compose.cohost.yml)
#   - Do NOT mark this as default_server (Cullinos API already is)

# Edge flood guard for auth endpoints. The API applies finer per-route limits
# itself; storefront traffic arrives from shared Vercel egress IPs, so keep this loose.
limit_req_zone $binary_remote_addr zone=jerzyfy_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=jerzyfy_api:20m rate=50r/s;

upstream jerzyfy_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.jerzyfy.in;
    server_tokens off;

    # Certbot will replace or extend this block for HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jerzyfy.in;
    server_tokens off;

    # Placeholder certs — certbot --nginx rewrites these paths.
    # After first certbot run, these ssl_* lines are managed by Certbot.
    ssl_certificate     /etc/letsencrypt/live/api.jerzyfy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jerzyfy.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Per-file limits are enforced by the API (images 5 MB, custom-order files 8 MB).
    client_max_body_size 10m;

    # Helmet sets these too; hide the upstream copies so responses carry one value each.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req_status 429;

    # WebSocket realtime (staff POS ↔ ERP)
    location /realtime {
        proxy_pass http://jerzyfy_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/(auth|store/auth)/ {
        limit_req zone=jerzyfy_auth burst=40 nodelay;
        proxy_pass http://jerzyfy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Customer custom-order inquiry: up to 5 files x 8 MB.
    location = /api/v1/store/custom-orders/inquiry {
        client_max_body_size 45m;
        limit_req zone=jerzyfy_api burst=100 nodelay;
        proxy_pass http://jerzyfy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        limit_req zone=jerzyfy_api burst=100 nodelay;
        proxy_pass http://jerzyfy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

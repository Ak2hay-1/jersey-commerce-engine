name: jersey-commerce-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: jce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks:
      - jce

  redis:
    image: redis:7-alpine
    container_name: jce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 128m
    networks:
      - jce

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: jce-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://${PUBLIC_IP},http://${PUBLIC_IP}:3000,http://${PUBLIC_IP}:3001,http://${PUBLIC_IP}:3002,http://${PUBLIC_IP}:4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-60}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET}
      TRUST_PROXY: "true"
      MEDIA_LOCAL_ROOT: /app/apps/api/uploads
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks:
      - jce

  storefront:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.next
      args:
        APP_NAME: storefront
        NEXT_PUBLIC_API_URL: http://${PUBLIC_IP}:4000
        NEXT_PUBLIC_DEFAULT_TENANT_SLUG: ${NEXT_PUBLIC_DEFAULT_TENANT_SLUG}
    container_name: jce-storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://${PUBLIC_IP}:4000
      NEXT_PUBLIC_DEFAULT_TENANT_SLUG: ${NEXT_PUBLIC_DEFAULT_TENANT_SLUG}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - jce

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.next
      args:
        APP_NAME: admin
        NEXT_PUBLIC_API_URL: http://${PUBLIC_IP}:4000
    container_name: jce-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://${PUBLIC_IP}:4000
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    networks:
      - jce

  pos:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.next
      args:
        APP_NAME: pos
        NEXT_PUBLIC_API_URL: http://${PUBLIC_IP}:4000
    container_name: jce-pos
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://${PUBLIC_IP}:4000
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    networks:
      - jce

  nginx:
    image: nginx:1.27-alpine
    container_name: jce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "3001:3001"
      - "3002:3002"
      - "4000:4000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - storefront
      - admin
      - pos
      - api
    mem_limit: 64m
    networks:
      - jce

volumes:
  postgres_data:
  redis_data:
  api_uploads:

networks:
  jce:
    driver: bridge

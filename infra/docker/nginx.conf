worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream storefront {
    server storefront:3000;
  }

  upstream api {
    server api:4000;
  }

  # Shop — http://YOUR_IP/
  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://storefront;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # Admin — static SPA at http://YOUR_IP:3001/
  server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/admin;

    location = /runtime-config.js {
      add_header Cache-Control "no-store";
    }

    location /_next/static/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ~ ^/sales/[^/]+/?$ {
      try_files /sales/[id]/index.html =404;
    }

    location ~ ^/orders/[^/]+/?$ {
      try_files /orders/[id]/index.html =404;
    }

    location ~ ^/products/[^/]+/?$ {
      try_files /products/[id]/index.html =404;
    }

    location ~ ^/purchases/[^/]+/?$ {
      try_files /purchases/[id]/index.html =404;
    }

    location ~ ^/suppliers/[^/]+/?$ {
      try_files /suppliers/[id]/index.html =404;
    }

    location ~ ^/customers/[^/]+/?$ {
      try_files /customers/[id]/index.html =404;
    }

    location ~ ^/expenses/[^/]+/?$ {
      try_files /expenses/[id]/index.html =404;
    }

    location ~ ^/custom-orders/[^/]+/?$ {
      try_files /custom-orders/[id]/index.html =404;
    }

    location ~ ^/inventory/(?!movements(?:/|$)|low-stock(?:/|$))[^/]+/?$ {
      try_files /inventory/[variantId]/index.html =404;
    }

    location ~ ^/promo-codes/[^/]+/?$ {
      try_files /promo-codes/[id]/index.html =404;
    }

    location ~ ^/users/[^/]+/?$ {
      try_files /users/[id]/index.html =404;
    }

    location / {
      try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }
  }

  # POS — static SPA at http://YOUR_IP:3002/
  server {
    listen 3002;
    server_name _;
    root /usr/share/nginx/pos;

    location = /runtime-config.js {
      add_header Cache-Control "no-store";
    }

    location /_next/static/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ~ ^/sales/[^/]+/?$ {
      try_files /sales/[id]/index.html =404;
    }

    location / {
      try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }
  }

  # API + WebSocket — http://YOUR_IP:4000/
  server {
    listen 4000;
    server_name _;

    location /realtime {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  # Per-file limits are enforced by the API; the custom-order inquiry route raises this below.
  client_max_body_size 10m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  server_tokens off;

  # Legacy stack serves plain HTTP, so HSTS is omitted here; the hybrid stack sets it at Caddy/nginx TLS.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
  limit_req_status 429;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream storefront {
    server storefront:3000;
  }

  upstream api {
    server api:4000;
  }

  # Shop — http://YOUR_IP/
  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://storefront;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # Admin — static SPA at http://YOUR_IP:3001/
  server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/admin;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' http: https:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;

    location = /runtime-config.js {
      add_header Cache-Control "no-store";
    }

    location /_next/static/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ~ ^/sales/[^/]+/?$ {
      try_files /sales/[id]/index.html =404;
    }

    location ~ ^/orders/[^/]+/?$ {
      try_files /orders/[id]/index.html =404;
    }

    location ~ ^/products/[^/]+/?$ {
      try_files /products/[id]/index.html =404;
    }

    location ~ ^/purchases/[^/]+/?$ {
      try_files /purchases/[id]/index.html =404;
    }

    location ~ ^/suppliers/[^/]+/?$ {
      try_files /suppliers/[id]/index.html =404;
    }

    location ~ ^/customers/[^/]+/?$ {
      try_files /customers/[id]/index.html =404;
    }

    location ~ ^/expenses/[^/]+/?$ {
      try_files /expenses/[id]/index.html =404;
    }

    location ~ ^/custom-orders/[^/]+/?$ {
      try_files /custom-orders/[id]/index.html =404;
    }

    location ~ ^/inventory/(?!movements(?:/|$)|low-stock(?:/|$))[^/]+/?$ {
      try_files /inventory/[variantId]/index.html =404;
    }

    location ~ ^/promo-codes/[^/]+/?$ {
      try_files /promo-codes/[id]/index.html =404;
    }

    location ~ ^/users/[^/]+/?$ {
      try_files /users/[id]/index.html =404;
    }

    location / {
      try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }
  }

  # POS — static SPA at http://YOUR_IP:3002/
  server {
    listen 3002;
    server_name _;
    root /usr/share/nginx/pos;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;

    location = /runtime-config.js {
      add_header Cache-Control "no-store";
    }

    location /_next/static/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ~ ^/sales/[^/]+/?$ {
      try_files /sales/[id]/index.html =404;
    }

    location / {
      try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }
  }

  # API + WebSocket — http://YOUR_IP:4000/
  server {
    listen 4000;
    server_name _;

    location /realtime {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location ~ ^/api/v1/(auth|store/auth)/ {
      limit_req zone=auth burst=40 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/store/custom-orders/inquiry {
      client_max_body_size 45m;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}

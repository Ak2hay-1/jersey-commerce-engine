name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://jersey:jersey@localhost:5432/jersey_commerce?schema=public
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:4000
  JWT_ACCESS_SECRET: replace-with-a-long-random-access-secret-32chars
  JWT_REFRESH_SECRET: replace-with-a-long-random-refresh-secret-32ch
  JWT_ACCESS_EXPIRATION: 15m
  JWT_REFRESH_EXPIRATION: 7d
  AUTH_RATE_LIMIT: 10
  AUTH_RATE_WINDOW_SECONDS: 60

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jersey
          POSTGRES_PASSWORD: jersey
          POSTGRES_DB: jersey_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jersey -d jersey_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations to a clean database
        run: npm run prisma:migrate:deploy

      - name: Check schema matches migrations (drift)
        working-directory: apps/api
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            || { echo "::error::prisma/schema.prisma has changes without a migration. Run 'npm run prisma:migrate' and commit the migration."; exit 1; }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
